<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rakuten Slider</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f5f5f5;
}

.swiper{
width:1200px;
max-width:95%;
margin:20px auto;
border-radius:20px;
overflow:hidden;
}

.swiper img{
width:100%;
display:block;
}

.swiper-button-next,
.swiper-button-prev{
color:#fff;
}

.swiper-pagination-bullet{
background:#fff;
opacity:0.7;
}

.swiper-pagination-bullet-active{
opacity:1;
width:20px;
border-radius:999px;
}

@media screen and (max-width:768px){

.swiper{
width:95%;
border-radius:16px;
}

.swiper-button-next,
.swiper-button-prev{
display:none;
}

}

</style>

</head>

<body>

<div class="swiper mySwiper">

<div class="swiper-wrapper">

<div class="swiper-slide">
<img src="https://image.rakuten.co.jp/pruvansay/cabinet/13030354/2043-bener.jpg">
</div>

<div class="swiper-slide">
<img src="https://image.rakuten.co.jp/pruvansay/cabinet/13110500/imgrc0114484131.jpg">
</div>

</div>

<div class="swiper-button-next"></div>
<div class="swiper-button-prev"></div>
<div class="swiper-pagination"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>

var swiper = new Swiper(".mySwiper", {

loop:true,

autoplay:{
delay:3000,
disableOnInteraction:false,
},

pagination:{
el:".swiper-pagination",
clickable:true,
},

navigation:{
nextEl:".swiper-button-next",
prevEl:".swiper-button-prev",
},

});

</script>

</body>
</html>
